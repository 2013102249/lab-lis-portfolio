<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>智检 LIS · 实验室信息化管理平台</title>
<link rel="stylesheet" href="css/style.css">

</head>
<body>

  <symbol id="i-flask" viewBox="0 0 24 24"><path d="M10 2v6.5L4.6 18a2 2 0 0 0 1.8 3h11.2a2 2 0 0 0 1.8-3L14 8.5V2"/><path d="M8.5 2h7"/><path d="M7.5 14h9"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></symbol>
  <symbol id="i-monitor" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M8 17v-6M13 17V7M18 17v-3"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3"/><path d="M1 14h6M9 8h6M17 16h6"/></symbol>

  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></symbol>

  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></symbol>

  <symbol id="i-chevron" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z"/></symbol>

  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="19" r="1.6"/></symbol>

  <symbol id="i-filter" viewBox="0 0 24 24"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M9 15l2 2 4-4"/></symbol>

</svg>

<!-- ============ 登录视图 ============ -->
<div id="login-view" class="login-wrap hidden">
  <div class="login-bg-deco"></div>
  <div class="login-card">
    <div class="login-brand">
      <div class="logo-mark"><svg class="ic"><use href="#i-flask"/></svg></div>
      <div>
        <h1>智检 LIS</h1>
        <p>实验室信息化管理平台</p>
      </div>
    </div>
    <p class="login-tip">打通样本全生命周期 · 检验流程 · 质控 · 设备对接 · 报告管理</p>
    <div class="login-label">选择角色进入演示环境</div>
    <div class="role-grid" id="role-grid"></div>
    <div class="login-foot">演示环境数据存储于本机浏览器 · 满足内网私有化部署架构演示</div>
  </div>
</div>

<!-- ============ 应用外壳 ============ -->
<div id="app-shell" class="app-shell hidden">
  <aside class="sidebar" id="sidebar">
    <div class="side-brand">
      <div class="logo-mark sm"><svg class="ic"><use href="#i-flask"/></svg></div>
      <div class="side-brand-txt"><b>智检 LIS</b><span>实验室信息化管理平台</span></div>
    </div>
    <nav class="side-nav" id="side-nav"></nav>
    <div class="side-foot" id="side-foot"></div>
  </aside>

  <div class="main-col">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="btn-side-toggle" onclick="W.toggleSide()"><svg class="ic"><use href="#i-menu"/></svg></button>
      <div class="topbar-title" id="topbar-title">工作台</div>
      <div class="topbar-spacer"></div>
      <button class="btn btn-primary btn-sm only-mobile" onclick="W.openScan()"><svg class="ic ic-sm"><use href="#i-scan"/></svg><span>扫码</span></button>
      <div class="msg-wrap">
        <button class="icon-btn" id="btn-bell" onclick="W.toggleMsg(event)"><svg class="ic"><use href="#i-bell"/></svg><span class="msg-dot hidden" id="msg-dot"></span></button>
        <div class="msg-panel hidden" id="msg-panel">
          <div class="msg-head"><b>消息中心</b><a href="javascript:;" onclick="W.readAllMsg()">全部已读</a></div>
          <div class="msg-list" id="msg-list"></div>
        </div>
      </div>
      <div class="user-chip" id="user-chip"></div>
      <button class="icon-btn" title="切换角色" onclick="W.logout()"><svg class="ic"><use href="#i-logout"/></svg></button>
    </header>
    <main class="page" id="page"></main>
  </div>

  <nav class="bottom-nav" id="bottom-nav"></nav>
  <div class="more-sheet-mask hidden" id="more-mask" onclick="W.closeMore()"></div>
  <div class="more-sheet" id="more-sheet"></div>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>
<div id="print-area"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/views-dashboard.js"></script>
<script src="js/views-samples.js"></script>
<script src="js/views-lab.js"></script>
<script src="js/views-qc.js"></script>
<script src="js/views-devices.js"></script>
<script src="js/views-reports.js"></script>
<script src="js/views-system.js"></script>
<script>W.init();</script>
</body>
</html>
